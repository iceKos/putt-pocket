<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#182c24">
  <link rel="icon" href="data:,">
  <title>Putt Pocket</title>
  <style>
    html, body { margin: 0; overflow: hidden; background: #182c24; }
    #game[inert] { visibility: hidden; }
    #boot {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      padding: 24px; text-align: center; color: #fffdf0;
      font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% 42%, #314d3c, #182c24 67%);
    }
    #boot [hidden] { display: none; }
    #boot:has(.boot-no-script) :is(#boot-status, #boot-activity) { display: none; }
    #boot .boot-title {
      position: relative; width: fit-content; margin: 0 auto 29px;
      font-size: clamp(42px, 10vw, 94px); font-weight: 1000; line-height: .9;
      letter-spacing: -.075em; transform: rotate(-4deg); text-shadow: 0 .055em #0d221b;
    }
    #boot .boot-title span { display: block; color: #ffce42; }
    #boot .boot-title::after {
      content: ""; position: absolute; inset: auto 1% -.13em;
      height: .13em; border: solid #43e6db; border-width: 0 0 .033em; border-radius: 50%;
    }
    #boot-status { margin: 0; font-size: 14px; font-weight: 650; }
    #boot-activity { display: flex; justify-content: center; gap: 7px; margin: 12px 0 0; }
    #boot-activity span {
      width: 7px; height: 7px; border-radius: 50%; background: #43e6db;
      animation: boot-pulse 1.2s ease-in-out infinite alternate;
    }
    #boot-activity span:nth-child(2) { animation-delay: .18s; }
    #boot-activity span:nth-child(3) { animation-delay: .36s; }
    #boot-retry {
      margin: 17px 0 0; border: 0; border-radius: 100px; padding: 11px 20px;
      background: #ffce42; color: #182c24; font: inherit; font-weight: 750; cursor: pointer;
    }
    #boot-retry:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    @keyframes boot-pulse { from { opacity: .35; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #boot-activity span { animation: none; } }
  </style>
</head>
<body>
  <div id="boot">
    <div>
      <p class="boot-title" aria-label="Putt Pocket">PUTT <span>POCKET</span></p>
      <p id="boot-status" role="status">Loading the course…</p>
      <div id="boot-activity" aria-hidden="true"><span></span><span></span><span></span></div>
      <button id="boot-retry" type="button" hidden>Try again</button>
      <noscript><p class="boot-no-script">Enable JavaScript to play.</p></noscript>
    </div>
  </div>
  <main id="game" inert>
    <canvas id="course" tabindex="0" aria-label="Mini golf course" aria-describedby="instructions"></canvas>
    <header class="hud">
      <div class="pill identity">
        <h1>PUTT <span>POCKET</span></h1>
        <span class="hole">HOLE <b id="hole-number">1</b> / <span id="hole-count">10</span> <span id="hole-layout">· A</span></span>
      </div>
      <div id="timer" class="pill timer" aria-label="Time remaining">0:52</div>
      <div class="scores">
        <div class="pill score" id="my-score" aria-label="Your strokes"><i class="player-icon" aria-hidden="true"></i><span class="player-name" hidden></span><span id="score">0</span></div>
        <div class="pill score" id="rival-score" aria-label="Opponent strokes" hidden><i class="player-icon" aria-hidden="true"></i><span class="player-name" hidden></span><span id="rival-strokes">0</span></div>
      </div>
    </header>
    <section class="course-info" aria-label="Current course">
      <span id="course-country" class="pill">Japan</span>
      <span id="course-name" class="pill">Kyoto Stone Garden</span>
      <span id="running-total" class="pill" hidden></span>
    </section>
    <div class="room-tools">
      <select id="practice-hole" aria-label="Practice hole and layout"></select>
      <span id="live-code" class="pill" hidden></span>
      <button id="room-button" type="button">Play with a friend</button>
    </div>
    <dialog id="lobby" class="result-card" aria-labelledby="lobby-title">
      <h2 id="lobby-title">Play with a friend</h2>
      <div id="lobby-actions">
        <button id="create-room" type="button">Create room</button>
        <form id="join-room">
          <label for="room-code">Room code</label>
          <div class="join-controls">
            <input id="room-code" name="code" required pattern="[A-Za-z2-9]{5}" maxlength="5" placeholder="ABCDE" autocomplete="off" spellcheck="false">
            <button type="submit">Join</button>
          </div>
        </form>
      </div>
      <div id="waiting-room" hidden>
        <p id="invite-code"></p>
        <p id="waiting-copy">Share this code. The round starts when your friend joins.</p>
      </div>
      <p id="lobby-status" role="status"></p>
      <button id="lobby-close" class="secondary" type="button">Back to practice</button>
    </dialog>
    <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Mute sound" aria-pressed="false" title="Mute sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
        <path class="sound-waves" d="M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/>
        <path class="sound-cross" d="m16 9 5 6m0-6-5 6"/>
      </svg>
    </button>
    <footer class="controls">
      <p id="instructions">Pull back from the ball and release to sling it.</p>
      <div class="pill stroke">
        <span>STROKE <b id="stroke">1</b> / 6</span>
        <div id="power" role="meter" aria-label="Shot power" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      </div>
    </footer>
    <section id="turnover" class="result turnover" hidden aria-labelledby="turnover-title">
      <div class="result-card">
        <h2 id="turnover-title"></h2>
        <p id="turnover-scores"></p>
        <p id="turnover-count"></p>
      </div>
    </section>
    <section id="result" class="result" hidden aria-labelledby="result-title">
      <div class="result-card">
        <p id="result-context">HOLE 1 · KYOTO STONE GARDEN</p>
        <h2 id="result-title"></h2>
        <p id="result-score"></p>
        <ol id="standings" aria-label="Final standings" hidden></ol>
        <button id="replay" type="button">Play again</button>
      </div>
    </section>
  </main>
  <script type="module" src="/src/boot.ts"></script>
</body>
</html>
